name: phase-8-v2-runtime

on:
  push:
    branches:
      - phase8-shadow-canary-rollout
      - maya-v2-operational-readiness
      - maya-v2-gap-remediation
  pull_request:
    paths:
      - "reservation_*/**"
      - "v2_*/**"
      - "config/**"
      - "deploy/**"
      - "tests/**"
      - "docs/refactor/ACTIVE.md"
      - "Dockerfile.v2"
      - ".dockerignore"
      - "compose.v2.yaml"
      - ".github/workflows/phase8.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: phase8-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agente-v2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install \
            "fastapi==0.133.1" \
            "httpx==0.28.1" \
            "pydantic==2.13.4" \
            "PyYAML==6.0.3" \
            "cryptography==46.0.7" \
            "uvicorn==0.41.0" \
            "pytest==9.0.2" \
            "ruff==0.15.10"
      - name: Static boundaries and formatting
        run: |
          ruff check v2_adapters v2_application v2_contracts v2_host deploy
          ruff check reservation_boundary/schema.py reservation_boundary/sqlite_store.py
          python scripts/check_fasttrack_boundaries.py
          git diff --check
          python -m compileall -q reservation_boundary reservation_confirmation reservation_domain reservation_execution reservation_followup reservation_lookup v2_adapters v2_application v2_contracts v2_host deploy
      - name: Hermetic operational contracts
        run: |
          python -m pytest -q \
            tests/test_v2_canary_router.py \
            tests/test_v2_runtime_identity.py \
            tests/test_v2_worker_main.py \
            tests/test_v2_stripe_reconciliation.py \
            tests/test_v2_rollback_harness.py
      - name: Render routed Compose with fake-only inputs
        run: |
          COMPOSE_TMP="$(mktemp -d)"
          export COMPOSE_TMP
          trap 'rm -rf "$COMPOSE_TMP"' EXIT
          mkdir -p "$COMPOSE_TMP/state" "$COMPOSE_TMP/hermes"
          : > "$COMPOSE_TMP/public-authority.json"
          : > "$COMPOSE_TMP/runtime-identity.json"
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          root = Path(os.environ["COMPOSE_TMP"])
          source = Path("compose.v2.yaml").read_text(encoding="utf-8")
          required = sorted(set(re.findall(r"\$\{([A-Z0-9_]+):\?", source)))
          values = {name: "fake-ci-value" for name in required}
          digest = "sha256:" + "b" * 64
          values.update(
              V2_CANDIDATE_GIT_SHA="a" * 40,
              V2_CANDIDATE_IMAGE_DIGEST=digest,
              V2_IMAGE_REF=f"registry.invalid/agente-v2@{digest}",
              V2_STATE_DIR=str(root / "state"),
              V2_HERMES_HOME_PATH=str(root / "hermes"),
              V2_PUBLIC_AUTHORITY_MANIFEST_HOST_PATH=str(
                  root / "public-authority.json"
              ),
              V2_RUNTIME_IDENTITY_METADATA_HOST_PATH=str(
                  root / "runtime-identity.json"
              ),
              V2_LEGACY_URL="http://legacy.invalid/webhook/manychat",
          )
          (root / "compose.env").write_text(
              "".join(f"{name}={values[name]}\n" for name in sorted(values)),
              encoding="utf-8",
          )
          PY
          docker compose --env-file "$COMPOSE_TMP/compose.env" -f compose.v2.yaml config --quiet
      - name: Full regression
        run: |
          python -m pytest -q \
            --deselect=tests/test_phase7_package.py::Phase7PackageTests::test_project_metadata_declares_closed_distribution \
            --deselect=tests/test_phase7_package.py::Phase7PackageTests::test_two_builds_are_byte_identical_closed_and_self_hashing \
            --deselect=tests/test_phase7_package.py::Phase7PackageTests::test_installed_wheel_imports_without_checkout_on_sys_path \
            --deselect=tests/test_phase7_closeout.py::Phase7EntryContractTests::test_wheel_bootstrap_is_closed_and_stdlib_only \
            --deselect=tests/test_phase7_closeout.py::Phase7CloseoutContractTests::test_manifest_is_deterministic_current_and_covers_runtime_patch \
            --deselect=tests/test_phase7_closeout.py::Phase7CloseoutContractTests::test_evidence_validator_reflects_current_terminal_artifacts \
            --deselect=tests/test_phase8_entry.py::Phase8EntryTests::test_phase_index_keeps_slice_zero_and_rollout_closed
      - name: Network-denied immutable image boot and import smoke
        run: |
          LOCAL_IMAGE="agente-v2-ci:${GITHUB_SHA}"
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="1970-01-01T00:00:00Z" \
            --build-arg VERSION="0.8.0-phase8" \
            --tag "$LOCAL_IMAGE" \
            --file Dockerfile.v2 .
          LOCAL_IMAGE_ID="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')"
          IDENTITY_REF="local.invalid/agente-v2@${LOCAL_IMAGE_ID}"
          IDENTITY_FILE="$(mktemp)"
          trap 'rm -f "$IDENTITY_FILE"' EXIT
          printf '{"schema":"v2-runtime-image-metadata-v1","labels":{"org.opencontainers.image.revision":"%s"},"repo_digests":["%s"]}\n' \
            "$GITHUB_SHA" "$IDENTITY_REF" > "$IDENTITY_FILE"
          chmod 0444 "$IDENTITY_FILE"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --volume "$IDENTITY_FILE:/run/v2/runtime-identity.json:ro" \
            --env "PYTHONDONTWRITEBYTECODE=1" \
            --env "CANARY_WEBHOOK_SECRET=fake-ci-webhook-secret" \
            --env "CANARY_SUBSCRIBER_ID=1873018537" \
            --env "CANARY_V2_URL=http://api.invalid/webhook/manychat" \
            --env "CANARY_V2_READY_URL=http://api.invalid/readyz" \
            --env "CANARY_LEGACY_URL=http://legacy.invalid/webhook/manychat" \
            --env "CANARY_CUTOVER_DEADLINE=" \
            --env "CANARY_EXPECTED_GIT_SHA=$GITHUB_SHA" \
            --env "CANARY_EXPECTED_IMAGE_REF=$IDENTITY_REF" \
            --env "CANARY_EXPECTED_IMAGE_DIGEST=$LOCAL_IMAGE_ID" \
            --env "CANARY_RUNTIME_IDENTITY_METADATA_PATH=/run/v2/runtime-identity.json" \
            --entrypoint python \
            "$LOCAL_IMAGE" \
            -c "from fastapi.testclient import TestClient; from deploy.canary_router import create_app_from_env; from deploy.verify_runtime_identity import verify_runtime_identity; from deploy.rollback_harness import rollback_to_previous; from v2_host.worker_main import WorkerCycle; client=TestClient(create_app_from_env()); response=client.get('/readyz'); assert response.status_code == 200, response.text"

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.v2
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=0.8.0-phase8
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image reference
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" | tee /tmp/v2-image-ref.txt
      - name: Upload digest evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: phase8-image-${{ github.sha }}
          path: /tmp/v2-image-ref.txt
          if-no-files-found: error
          retention-days: 30

  gate:
    if: always()
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require test and image jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$IMAGE_RESULT" = success
