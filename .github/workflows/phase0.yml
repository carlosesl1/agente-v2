name: phase-0-validation

# Historical phase validation is manual; v2-main.yml validates the integrated source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Phase 0 artifacts
        run: python3 scripts/validate_phase0.py
